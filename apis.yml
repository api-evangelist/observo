name: Observo
description: Observo AI built an AI-native data pipeline (telemetry pipeline) platform that optimizes
  security and observability data in flight, filtering, enriching, and normalizing logs, metrics, and
  traces into standard schemas like OCSF to cut SIEM and observability data volume and cost before
  ingestion into the SOC. Founded in 2022 and backed by Felicis, Observo AI was acquired by SentinelOne;
  the observo.ai domain now 301-redirects to SentinelOne's Singularity AI Data Pipelines product, its
  documentation host (docs.observo.ai) is authentication-gated, and there is no public developer API,
  OpenAPI specification, or programmatic surface to enrich.
